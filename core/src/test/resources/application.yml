# Shadows core/src/main/resources/application.yml for tests. Test resources precede
# main on the classpath, so this file is loaded instead of the production one.
#
# It exists only to drop the production file's
#   config.import: configserver:http://${CLOUD_CONFIG_SERVER:localhost}:${CLOUD_CONFIG_SERVER_PORT:8888}/
# A config.import declared inside a config file cannot be removed or made optional
# from outside it, so shadowing is the only clean way. See the equivalent file in
# the ui module for the full reasoning.
spring:
  application:
    name: core
  profiles:
    active: test
  codec:
    max-in-memory-size: 10MB

server:
  port: 0
