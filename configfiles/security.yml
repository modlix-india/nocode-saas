spring:
  r2dbc:
    url: ${security.db.url}
    username: ${security.db.username}
    password: ${security.db.password}
    pool:
      # Until 2026-09-29 these numbers did nothing. commons-jooq built its own pool and never
      # read spring.r2dbc.pool.*, so every query ran through a pool stuck at r2dbc-pool's
      # default of 10 while THIS block configured a second pool that nothing used. Now there is
      # one pool and these values are real, so 4 would have been a cut from the effective 10.
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${security.db.flyway.url}
    user: ${security.db.username}
    password: ${security.db.password}
  boot:
    admin:
      client:
        instance:
          name: Security
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  cloud:
    gateway:
      routes:
        - id: security
          uri: lb://security
          predicates:
            - Path=/api/security/**, /*/api/security/**, /*/*/api/security/**, /*/*/*/api/security/**, /*/*/*/*/api/security/**, /*/*/*/*/*/api/security/**, /*/*/*/*/*/*/api/security/**, /*/*/*/*/*/*/api/security/**, /*/*/*/*/*/*/*/api/security/**, /*/*/*/*/*/*/*/*/api/security/**, /*/*/*/*/*/*/*/*/*/api/security/**,
  rabbitmq:
    host: ${mq.host}
    port: ${mq.port}
    username: ${mq.username}
    password: ${mq.password}

management:
  endpoint:
    flyway:
      enabled: true

redis:
  cache:
    prefix: sec

sms:
  provider:
    2factor:
      api:
        key: ${smsService.provider.2factor.api.key}

# Draft hostnames need no key of their own. They are built as
# d<32 hex><security.appCodeSuffix>.modlix.com, reusing the one per-environment
# marker this service already uses for every other URL it builds, so there is no
# second setting to keep in step. Blank appCodeSuffix is production and gives
# d<hex>.modlix.com.
#
# The domain is fixed at modlix.com and does NOT follow the app's own live URL.
# Apps live on sitezump.ai, fincity.com, cityville.in and third-party domains the
# platform holds no wildcard certificate for; a draft host has to land somewhere we
# can actually serve.
#
# LOCAL ONLY CAVEAT: /etc/hosts cannot wildcard, so a minted host does not resolve
# on this machine until its exact name is added there. The agent works around that
# by sending X-Forwarded-Host, which the gateway already reads; a human reviewing
# the draft in a browser needs the hosts line.
