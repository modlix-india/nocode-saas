spring:
  r2dbc:
    url: ${multi.db.url}
    username: ${multi.db.username}
    password: ${multi.db.password}
    pool:
      # Until 2026-09-29 these numbers did nothing. commons-jooq built its own pool and never
      # read spring.r2dbc.pool.*, so every query ran through a pool stuck at r2dbc-pool's
      # default of 10 while THIS block configured a second pool that nothing used. Now there is
      # one pool and these values are real, so 4 would have been a cut from the effective 10.
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${multi.db.flyway.url}
    user: ${multi.db.username}
    password: ${multi.db.password}
  boot:
    admin:
      client:
        instance:
          name: Multi
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  cloud:
    gateway:
      routes:
        - id: multi
          uri: lb://multi
          predicates:
            - Path=/api/multi/**, /*/api/multi/**, /*/*/api/multi/**, /*/*/*/api/multi/**, /*/*/*/*/api/multi/**, /*/*/*/*/*/api/multi/**, /*/*/*/*/*/*/api/multi/**, /*/*/*/*/*/*/*/api/multi/**, /*/*/*/*/*/*/*/*/api/multi/**, /*/*/*/*/*/*/*/*/*/api/multi/**,

management:
  endpoint:
    flyway:
      enabled: true

redis:
  cache:
    prefix: mul
