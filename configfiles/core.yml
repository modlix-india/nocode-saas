spring:
  r2dbc:
    url: ${core.db.url}
    username: ${core.db.username}
    password: ${core.db.password}
    pool:
      # Until 2026-09-29 these numbers did nothing. commons-jooq built its own pool and never
      # read spring.r2dbc.pool.*, so every query ran through a pool stuck at r2dbc-pool's
      # default of 10 while THIS block configured a second pool that nothing used. Now there is
      # one pool and these values are real, so 4 would have been a cut from the effective 10.
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${core.db.flyway.url}
    user: ${core.db.username}
    password: ${core.db.password}
  data:
    mongodb:
      uri: ${core.mongo.uri}
      # Spring Data defaults this to false since 3.0, and it was set only in
      # src/test/resources/application-test.yml -- so the test suites built every
      # @CompoundIndex in the codebase and no running server ever did. All 27 of them were
      # missing from dev, stage and production until 2026-09-27. ui.page is 2118 documents but
      # 208MB, so the page lookup by {appCode, clientCode, name} was collection-scanning all of
      # it: docsExamined 2118, up to 1631ms. With the index, docsExamined 1.
      #
      # Safe to switch on only because every declared index already exists with a matching
      # spec -- each one was resolved through MongoPersistentEntityIndexResolver and diffed
      # against all three environments first. A name that exists with a DIFFERENT key spec does
      # not warn, it throws IndexKeySpecsConflict and the service fails to start.
      auto-index-creation: true
  boot:
    admin:
      client:
        instance:
          name: Core
  cloud:
    gateway:
      routes:
        - id: core
          uri: lb://core
          predicates:
            - Path=/api/core/**, /*/api/core/**, /*/*/api/core/**, /*/*/*/api/core/**, /*/*/*/*/api/core/**, /*/*/*/*/*/api/core/**, /*/*/*/*/*/*/api/core/**, /*/*/*/*/*/*/*/api/core/**, /*/*/*/*/*/*/*/*/api/core/**, /*/*/*/*/*/*/*/*/*/api/core/**,
  rabbitmq:
    host: ${mq.host}
    port: ${mq.port}
    username: ${mq.username}
    password: ${mq.password}

redis:
  cache:
    prefix: cor

facebook:
  whatsapp:
    webhook:
      verify-token: ~
